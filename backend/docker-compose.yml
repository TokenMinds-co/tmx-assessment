# Local build of the production image, run against its own Postgres. For
# checking the image before it ships; day-to-day development uses `pnpm db:start`
# and `pnpm start:dev` instead (see README.md).
#
#   cp .env.example .env                    # or reuse your dev .env
#   cp database.env.example database.env
#   docker compose up --build
#   curl localhost:4000/api/health/ready    # 4000 = PORT in .env
#
# NODE_ENV comes from .env. With `production` the API needs RESEND_API_KEY and
# sets Secure cookies, which a browser on plain http://localhost won't send
# back, so keep `development` for a local sign-in check.
#
# Explicit project name so `--remove-orphans` stays scoped to this stack and
# never touches sibling projects that also live in a "backend" directory.
name: tmx-hr
services:
  postgres:
    image: postgres:17-alpine
    container_name: tmx_hr_pg
    restart: unless-stopped
    env_file:
      - database.env
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 256M
          cpus: "0.25"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tmx_hr}",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tmx_hr_network
    ports:
      # 5434 on the host, clear of a Postgres already on 5432 or 5433.
      - "5434:5432"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: tmx_hr_be
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - STORAGE_DIR=/app/storage
      # DATABASE_URL in .env points at localhost, which inside a container is
      # the container itself, so it is overridden to reach the postgres
      # service. The values match database.env.example.
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/tmx_hr
    volumes:
      - tmx_hr_storage:/app/storage
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 256M
          cpus: "0.5"
    healthcheck:
      # 127.0.0.1, not localhost: localhost resolves to ::1 first in this
      # container and the app binds IPv4, so a localhost probe is refused.
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--spider",
          "-T",
          "5",
          "http://127.0.0.1:${PORT:-4000}/api/health/ready",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tmx_hr_network
    ports:
      # The app listens on PORT (from .env, default 4000), published as-is.
      - "${PORT:-4000}:${PORT:-4000}"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
    driver: local
  tmx_hr_storage:
    driver: local

networks:
  tmx_hr_network:
    driver: bridge
    internal: false
