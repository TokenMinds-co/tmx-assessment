# Local build of the production image. The same stack as
# docker-compose-production.yml, except the image is built from this folder
# instead of pulled from GHCR. It's for checking the image before it ships;
# day-to-day development uses `pnpm db:start` and `pnpm start:dev` (README.md).
#
# Postgres is not part of this stack. Like production, it expects a Postgres
# container already running on this host and attached to the external network
# named below, and it reads DATABASE_URL from .env, so DATABASE_URL must name
# that Postgres container (for example postgres_db), not localhost.
#
# If you have no such container, this file is not the one you want: use
# docker-compose.local.yml, which brings its own Postgres and needs no .env.
#
#   docker compose up --build
#   curl localhost:4000/api/health/ready    # 4000 = PORT in .env
#
# NODE_ENV comes from .env. With `production` the API needs RESEND_API_KEY and
# sets Secure cookies, which a browser on plain http://localhost won't send
# back, so keep `development` for a local sign-in check.
#
# Explicit project name so `--remove-orphans` stays scoped to this stack and
# never touches another project deployed from a directory that is also called
# "backend".
name: tmx-assessment
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: tmx_assessment_be
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Uploads live on the volume below, whatever STORAGE_DIR says in .env.
      - STORAGE_DIR=/app/storage
    volumes:
      - tmx_assessment_storage:/app/storage
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 256M
          cpus: "0.5"
    healthcheck:
      # 127.0.0.1, not localhost: localhost resolves to ::1 first in this
      # container and the app binds IPv4, so a localhost probe is refused.
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--spider",
          "-T",
          "5",
          "http://127.0.0.1:${PORT:-4000}/api/health/ready",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - tmx_assessment_network
      - postgres_network
    ports:
      # The app listens on PORT (from .env, default 4000), published as-is.
      - "${PORT:-4000}:${PORT:-4000}"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  tmx_assessment_storage:
    driver: local

networks:
  tmx_assessment_network:
    driver: bridge
    internal: false
  # The network the host's Postgres container is attached to. `external: true`:
  # Compose attaches to it and never creates or removes it, so `docker compose
  # down` here cannot take the database down. It must already exist
  # (`docker network ls`); rename it here if yours is called something else.
  postgres_network:
    external: true
