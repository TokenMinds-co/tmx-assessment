# Production deploy. Pulls a pre-built image from GHCR instead of building.
# The deploy job sets IMAGE_NAME and IMAGE_TAG and runs `docker compose up -d`
# (see .github/workflows/deploy.yml). Postgres is not part of this stack: it
# expects a Postgres container already running on the host and attached to the
# external network named below, which this file joins and never creates or
# removes. Set DATABASE_URL in .env to reach it, by the container's name.
# See docs/operations.md#deployment.
#
# For a stack that brings its own Postgres and needs no .env - a laptop, a
# fork, a first look - use docker-compose.local.yml instead.
#
# Explicit project name. Without it, Compose derives the project from the
# directory basename ("backend"), which collides with any other project
# deployed from a directory of that name, and `--remove-orphans` would then
# treat THEIR containers as orphans and delete them. A unique name isolates
# this stack.
name: tmx-assessment
services:
  backend:
    image: ${IMAGE_NAME:-ghcr.io/tokenminds-co/tmx-assessment-backend}:${IMAGE_TAG:-production-latest}
    container_name: tmx_assessment_be
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      # Uploads live on the volume below, whatever STORAGE_DIR says in .env.
      - STORAGE_DIR=/app/storage
    volumes:
      # Question audio and images. `docker compose down` keeps it; only
      # `down -v` deletes it, and with it every upload.
      - tmx_assessment_storage:/app/storage
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 256M
          cpus: "0.5"
    healthcheck:
      # Readiness, not liveness: on Docker nothing restarts an unhealthy
      # container, so "unhealthy" here means "cannot serve", which is the
      # useful signal. The path carries the `api` prefix set in app.setup.ts.
      # 127.0.0.1, not localhost: localhost resolves to ::1 first in this
      # container and the app binds IPv4, so a localhost probe is refused.
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--spider",
          "-T",
          "5",
          "http://127.0.0.1:${PORT:-4000}/api/health/ready",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - tmx_assessment_network
      - postgres_network
    ports:
      # The app listens on PORT (from .env, default 4000), and the same port is
      # published on the host. Point the reverse proxy at it.
      - "${PORT:-4000}:${PORT:-4000}"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  tmx_assessment_storage:
    driver: local

networks:
  tmx_assessment_network:
    driver: bridge
    internal: false
  # The network the host's Postgres container is attached to, created by
  # whatever stack runs that database, not by this one. `external: true` is
  # load-bearing: Compose attaches to it and never creates or removes it, so
  # `docker compose down` here cannot take the database down. It must already
  # exist on the server (`docker network ls`); rename it here if yours is
  # called something else.
  postgres_network:
    external: true
