# Production deploy. Pulls a pre-built image from GHCR instead of building.
# The CI deploy job sets IMAGE_NAME and IMAGE_TAG and runs `docker compose up -d`
# (see .github/workflows/backend.yml). Postgres is the instance already on the
# server: this file joins its network and never creates or removes it. Set
# DATABASE_URL in .env to reach it. See docs/operations.md#deployment.
#
# Explicit project name. Without it, Compose derives the project from the
# directory basename ("backend"), which collides with sibling repos deployed
# from their own "backend" dir, and `--remove-orphans` would then treat THEIR
# containers as orphans and delete them. A unique name isolates this stack.
name: tmx-hr
services:
  backend:
    image: ${IMAGE_NAME:-ghcr.io/tokenminds-co/tmx-hr-backend}:${IMAGE_TAG:-production-latest}
    container_name: tmx_hr_be
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      # Uploads live on the volume below, whatever STORAGE_DIR says in .env.
      - STORAGE_DIR=/app/storage
    volumes:
      # Question audio and images. `docker compose down` keeps it; only
      # `down -v` deletes it, and with it every upload.
      - tmx_hr_storage:/app/storage
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 256M
          cpus: "0.5"
    healthcheck:
      # Readiness, not liveness: on Docker nothing restarts an unhealthy
      # container, so "unhealthy" here means "cannot serve", which is the
      # useful signal. The path carries the `api` prefix set in app.setup.ts.
      # 127.0.0.1, not localhost: localhost resolves to ::1 first in this
      # container and the app binds IPv4, so a localhost probe is refused.
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--spider",
          "-T",
          "5",
          "http://127.0.0.1:${PORT:-4000}/api/health/ready",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - tmx_hr_network
      - postgres_network
    ports:
      # The app listens on PORT (from .env, default 4000), and the same port is
      # published on the host. Point the reverse proxy at it.
      - "${PORT:-4000}:${PORT:-4000}"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  tmx_hr_storage:
    driver: local

networks:
  tmx_hr_network:
    driver: bridge
    internal: false
  # The database's network, created by the server's Postgres stack.
  # `external: true` is load-bearing: Compose attaches to it and never creates
  # or removes it, so `docker compose down` here cannot take the database down.
  postgres_network:
    external: true
